services:
  - type: web
    name: titanic-city-ventures
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: titanic-city-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false

databases:
  - name: titanic-city-db
    plan: free
    databaseName: titanic_city
    user: titanic_city_user
